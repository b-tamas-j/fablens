[project]
name = "fablens"
version = "0.1.0"
description = "Data Agent prototype that answers questions about equipment and service data with traceable sources."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "a2a-sdk>=1.3.1",
    "chainlit>=2.12.0",
    "duckdb>=2.0.1",
    "langchain>=1.5.2",
    "langchain-google-genai>=4.5.2",
    "langchain-groq>=1.2.1",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
]

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest]
testpaths = ["tests"]
