<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="788" viewBox="0 0 1000 788" role="img" aria-label="AI Factory reference architecture">
  <style>
    text { font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .label { font-size: 11px; font-weight: 600; letter-spacing: 1.4px; fill: #7C879C; }
    .title { font-size: 14px; font-weight: 600; fill: #E6EAF2; }
    .sub { font-size: 11.5px; fill: #9AA5B8; }
    .note { font-size: 11px; fill: #9AA5B8; }
    .chip { font-size: 12.5px; fill: #C3CAD6; }
    .band { fill: #131C2E; stroke: #26314A; }
    .box { fill: #1B263D; stroke: #3B4864; }
    .flow { fill: none; stroke: #5A6782; stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#5A6782"/>
    </marker>
  </defs>

  <rect width="1000" height="788" rx="16" fill="#0E1525"/>

  <rect class="band" x="24" y="24" width="952" height="88" rx="12"/>
  <text class="label" x="44" y="46">EXPERIENCE</text>
  <rect class="box" x="48" y="60" width="264" height="36" rx="8"/>
  <text class="title" x="180" y="83" text-anchor="middle">Chat UI · Teams</text>
  <rect class="box" x="368" y="60" width="264" height="36" rx="8"/>
  <text class="title" x="500" y="83" text-anchor="middle">API clients</text>
  <rect class="box" x="688" y="60" width="264" height="36" rx="8"/>
  <text class="title" x="820" y="83" text-anchor="middle">Other agents</text>

  <rect class="band" x="24" y="160" width="952" height="346" rx="12"/>
  <text class="label" x="44" y="182">AI FACTORY PLATFORM · CLOUD</text>

  <path class="flow" d="M500 112 V194" marker-end="url(#arrow)"/>
  <text class="note" x="512" y="140">HTTPS · A2A</text>

  <rect class="box" x="48" y="196" width="904" height="48" rx="8"/>
  <text class="title" x="500" y="216" text-anchor="middle">Agent gateway and registry</text>
  <text class="sub" x="500" y="234" text-anchor="middle">SSO · routing · agent cards</text>

  <path class="flow" d="M500 244 V266" marker-end="url(#arrow)"/>

  <rect x="48" y="268" width="904" height="104" rx="10" fill="#172238" stroke="#2E3A55"/>
  <text class="label" x="64" y="288">AGENT RUNTIME · CONTAINERS</text>
  <rect x="112" y="300" width="360" height="56" rx="8" fill="#1B263D" stroke="#FFB020" stroke-width="1.5"/>
  <text class="title" x="292" y="324" text-anchor="middle" style="fill: #FFB020">Data Agent · FabLens</text>
  <text class="sub" x="292" y="342" text-anchor="middle" style="fill: #C3CAD6">this prototype</text>
  <rect class="box" x="528" y="300" width="360" height="56" rx="8"/>
  <text class="title" x="708" y="324" text-anchor="middle">Other agents</text>
  <text class="sub" x="708" y="342" text-anchor="middle">built on the same golden path</text>

  <path class="flow" d="M188 372 V404" marker-end="url(#arrow)"/>
  <path class="flow" d="M500 372 V404" marker-end="url(#arrow)"/>
  <path class="flow" d="M812 372 V404" marker-end="url(#arrow)"/>

  <rect class="box" x="48" y="406" width="280" height="76" rx="8"/>
  <text class="title" x="188" y="430" text-anchor="middle">LLM gateway</text>
  <text class="sub" x="188" y="449" text-anchor="middle">model routing · quotas</text>
  <text class="sub" x="188" y="465" text-anchor="middle">fallback · PII filter</text>

  <rect class="box" x="360" y="406" width="280" height="76" rx="8"/>
  <text class="title" x="500" y="430" text-anchor="middle">Context layer</text>
  <text class="sub" x="500" y="449" text-anchor="middle">business glossary · semantic layer</text>
  <text class="sub" x="500" y="465" text-anchor="middle">data catalog</text>

  <rect class="box" x="672" y="406" width="280" height="76" rx="8"/>
  <text class="title" x="812" y="430" text-anchor="middle">Tool layer · MCP servers</text>
  <text class="sub" x="812" y="449" text-anchor="middle">read-only</text>
  <text class="sub" x="812" y="465" text-anchor="middle">identity passthrough</text>

  <path class="flow" d="M188 482 V550" marker-end="url(#arrow)"/>
  <path class="flow" d="M684 482 V550" marker-end="url(#arrow)"/>
  <path class="flow" d="M880 482 V550" marker-end="url(#arrow)"/>
  <text class="note" x="868" y="518" text-anchor="end">private link</text>
  <text class="note" x="868" y="530" text-anchor="end">secure gateway</text>

  <rect class="box" x="48" y="552" width="280" height="68" rx="8"/>
  <text class="title" x="188" y="576" text-anchor="middle">Models</text>
  <text class="sub" x="188" y="595" text-anchor="middle">cloud LLMs</text>
  <text class="sub" x="188" y="611" text-anchor="middle">self-hosted open-weight models</text>

  <rect class="box" x="604" y="552" width="160" height="68" rx="8"/>
  <text class="title" x="684" y="580" text-anchor="middle">Cloud lakehouse</text>
  <text class="sub" x="684" y="600" text-anchor="middle">existing cloud data</text>

  <rect x="784" y="536" width="192" height="128" rx="12" fill="none" stroke="#5A6782" stroke-dasharray="5 4"/>
  <rect class="box" x="796" y="552" width="168" height="68" rx="8"/>
  <text class="title" x="880" y="580" text-anchor="middle">Source systems</text>
  <text class="sub" x="880" y="600" text-anchor="middle">ERP · MES · service DB</text>
  <text class="label" x="800" y="652">ON-PREMISES</text>

  <rect class="band" x="24" y="688" width="952" height="76" rx="12"/>
  <text class="label" x="44" y="710">CROSS-CUTTING · EVERY LAYER</text>
  <rect class="box" x="48" y="722" width="164" height="32" rx="16"/>
  <text class="chip" x="130" y="743" text-anchor="middle">Identity and RBAC</text>
  <rect class="box" x="233" y="722" width="164" height="32" rx="16"/>
  <text class="chip" x="315" y="743" text-anchor="middle">Guardrails</text>
  <rect class="box" x="418" y="722" width="164" height="32" rx="16"/>
  <text class="chip" x="500" y="743" text-anchor="middle">Tracing · cost · audit</text>
  <rect class="box" x="603" y="722" width="164" height="32" rx="16"/>
  <text class="chip" x="685" y="743" text-anchor="middle">Evaluation</text>
  <rect class="box" x="788" y="722" width="164" height="32" rx="16"/>
  <text class="chip" x="870" y="743" text-anchor="middle">CI/CD golden path</text>
</svg>
